<!-- Sem planilha carregada não existe painel: a tela de carga vem antes do
     shell inteiro (marca, menu, filtros). Quando a API entrar no lugar do
     upload, é só esta condição que muda. -->
@if (!dados.pronto()) {
  <app-carregar />
} @else {
  <app-topbar />

  <div class="shell">
    <main class="shell__main">
      <router-outlet />
    </main>

    <footer class="shell__footer">
      @if (dados.origem(); as origem) {
        Dados lidos de <strong>{{ origem.arquivo }}</strong> nesta sessão — o arquivo não sai do
        seu navegador.
      } @else {
        Dados provenientes da Planilha Oficial de Indicadores da Parceria Enap × Impact Hub Brasil.
      }
    </footer>
  </div>
}
